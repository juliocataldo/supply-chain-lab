<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Supply Chain Lab - Revisão de Dependências</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2d3646;--tx:#e6edf3;--mut:#9aa7b8;--acc:#4da3ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;margin-right:auto}header h1 small{color:var(--mut);font-weight:400;margin-left:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:center;min-width:92px}
.kpi b{display:block;font-size:18px}.kpi span{color:var(--mut);font-size:11px}
input[type=text],textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:100%}
header input[type=text]{width:190px}
button{background:var(--acc);color:#04111f;border:0;border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px;min-height:calc(100vh - 64px)}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
.card:hover,.card.sel{border-color:var(--acc)}.card.done{opacity:.7}.card .t{font-weight:600}.card .m{color:var(--mut);font-size:12px}
h2{font-size:17px;margin:0 0 4px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 6px}
p.lead{color:var(--mut);margin:0 0 10px}
details{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details ul{margin:6px 0 2px;padding-left:18px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 Consolas,monospace;margin:0}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{color:var(--mut);font-weight:500;width:34%}
.chip{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;border:1px solid var(--line);color:var(--mut);margin-right:4px}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.no{color:var(--bad);border-color:var(--bad)}.chip.wr{color:var(--warn);border-color:var(--warn)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.out{background:var(--panel2);border-left:3px solid var(--acc);padding:6px 10px;margin:6px 0;font-size:13px}.out code{color:var(--mut);display:block;font-size:12px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 10px}legend{color:var(--mut);font-size:12px;padding:0 4px}
label.opt{display:block;padding:2px 0;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.fb{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px;background:var(--panel2)}
.err{color:var(--bad);margin:6px 0}.mut{color:var(--mut)}.badc{color:var(--bad)}.good{color:var(--ok)}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;max-width:780px;width:92vw;max-height:88vh;overflow:auto}dialog::backdrop{background:#000a}
</style>
</head>
<body>
<header>
  <h1>Supply Chain Lab<small>Revisão de PRs de dependência - OrbitaPay (fictício)</small></h1>
  <input type="text" id="analyst" placeholder="Seu nome / RM (opcional)" aria-label="Nome" maxlength="60" autocomplete="off">
  <div class="kpi"><b id="kRev">0/7</b><span>PRs revisados</span></div>
  <div class="kpi"><b id="kOk">0</b><span>Vereditos certos</span></div>
  <div class="kpi"><b id="kChk">0</b><span>Verificações feitas</span></div>
  <button class="sec" id="bRep">Relatório</button>
  <button class="sec" id="bJson" title="Resultado estruturado para o professor">Exportar .json</button>
  <button id="bDeb">Debrief</button>
  <button class="sec" id="bRst">Reiniciar</button>
</header>
<main>
  <section class="panel" aria-label="Fila de PRs"><div id="list"></div></section>
  <section class="panel" id="detail" aria-live="polite"></section>
</main>
<dialog id="dlg"></dialog>

function list(){const b=$('#list');b.replaceChildren(h('details',null,h('summary',null,'Política de dependências da OrbitaPay'),h('ul',null,
  h('li',null,'Auto-merge só para patch, com provenance válida e sem scripts novos.'),h('li',null,'Cooldown de 7 dias para versões recém-publicadas, exceto correção de vulnerabilidade alta/crítica.'),
  h('li',null,'Pacotes internos usam o escopo @orbita e vêm do registry privado.'),h('li',null,'package-lock.json sempre commitado e revisado.'),h('li',null,'Pacote novo exige justificativa e verificação de reputação.'))));

  const box=$('#detail');box.replaceChildren();
  if(!S.sel){box.append(h('h2',null,'Bem-vindo à revisão de dependências'),h('p',{class:'lead'},'Você é a pessoa de segurança do time. O bot abriu PRs de atualização de dependências e um colega propôs um pacote novo. Há 7 PRs na fila.'),
    h('ol',{class:'mut'},h('li',null,'Leia o PR e o changelog.'),h('li',null,'Execute as VERIFICAÇÕES que você acha necessárias (cada uma mostra evidências).'),h('li',null,'Decida: aceitar, aceitar com condições, rejeitar ou investigar.'),h('li',null,'Marque os sinais que viu e as ações que tomaria, e justifique.')),
    h('p',{class:'mut'},'Dica: nem todo PR é perigoso, e nem todo PR perigoso parece perigoso. Todos os pacotes, pessoas e domínios são fictícios.'));return;}
  const c=CASES.find(x=>x.id===S.sel);const done=S.done[c.id];const run=S.run[c.id]||(S.run[c.id]=new Set());
  box.append(h('h2',null,`${c.id}: ${c.title}`),h('div',{class:'mut'},`${c.eco} | aberto por ${c.by}`),h('p',null,h('b',null,'Onde é usado: '),c.use),
    h('h3',null,'Changelog'),h('pre',null,c.log),h('h3',null,'Metadados do registro'),h('table',null,...c.meta.map(([k,v])=>h('tr',null,h('th',null,k),h('td',null,v)))),
    h('h3',null,'Verificações (clique para executar)'));
  const outs=h('div');const chk=h('div',{class:'chk'});
  const show=k=>{const lbl=CHECKS.find(x=>x[0]===k)[1];return h('div',{class:'out'},h('code',null,'$ '+lbl),k==='diff'?h('pre',{style:'margin-top:6px'},c.chk[k]):c.chk[k]);};
  CHECKS.forEach(([k,l])=>chk.append(h('button',{class:'sec',disabled:run.has(k)?'':false,onclick:e=>{run.add(k);e.target.disabled=true;outs.append(show(k));kpis();}},l)));
  [...run].forEach(k=>outs.append(show(k)));
  box.append(chk,outs,h('h3',null,'Sua decisão'),form(c,done));
  if(done)box.append(feedback(c,done));
}
function form(c,done){
  const A=done?done.a:{};const dis=done?'':false;const f=h('div');
  f.append(h('fieldset',null,h('legend',null,'Veredito'),...Object.entries(VERD).map(([k,t])=>h('label',{class:'opt'},h('input',{type:'radio',name:'v',value:k,checked:A.v===k?'':false,disabled:done?'':false}),' '+t))));
  const g=(type,title)=>h('fieldset',null,h('legend',null,title),...Object.entries(SIGS).filter(([,s])=>s[1]===type).map(([k,s])=>h('label',{class:'opt'},h('input',{type:'checkbox',name:'s',value:k,checked:A.s&&A.s.includes(k)?'':false,disabled:done?'':false}),' '+s[0])));
  f.append(h('div',{class:'grid2'},g('r','Sinais de risco que você observou'),g('p','Sinais a favor')));
  f.append(h('fieldset',null,h('legend',null,'Ações que você tomaria'),...Object.entries(ACTS).map(([k,t])=>h('label',{class:'opt'},h('input',{type:'checkbox',name:'a',value:k,checked:A.a&&A.a.includes(k)?'':false,disabled:done?'':false}),' '+t))));
  const note=h('textarea',{rows:'2',maxlength:'400',placeholder:'Justificativa: qual evidência decidiu o seu veredito?',disabled:done?'':false},A.note||'');const err=h('div',{class:'err',role:'alert'});
  const conf=h('select',{id:'conf','aria-label':'Confiança',disabled:done?'':false},h('option',{value:''},'- selecione -'),...[['1','1 - chutei'],['2','2 - insegura(o)'],['3','3 - razoável'],['4','4 - confiante'],['5','5 - tenho certeza']].map(([v,t])=>h('option',{value:v,selected:A.conf===v?'':false},t)));
  f.append(h('label',{for:'conf',class:'mut'},'Confiança na sua decisão'),conf,note,err,h('button',{disabled:done?'':false,onclick:()=>{const v=(f.querySelector('[name=v]:checked')||{}).value;const s=[...f.querySelectorAll('[name=s]:checked')].map(x=>x.value),a=[...f.querySelectorAll('[name=a]:checked')].map(x=>x.value);
    if(!v||!a.length||!conf.value){err.textContent='Escolha um veredito, ao menos uma ação e o seu nível de confiança.';return;}
    const a2={v,s,a,conf:conf.value,note:note.value.trim()};S.done[c.id]={a:a2,g:grade(c,a2)};list();detail();}},'Registrar revisão'));
  return f;
}
function setCmp(sel,r){const miss=r.must.filter(x=>!sel.includes(x));const extra=sel.filter(x=>!r.must.includes(x)&&!r.ok.includes(x));return{miss,extra,ok:!miss.length&&!extra.length};}
function grade(c,a){const r=c.ref;const ex=a.v===r.v,alt=r.ok.includes(a.v);return{v:ex||alt,exact:ex,alt:alt&&!ex,s:setCmp(a.s,r.sig),a:setCmp(a.a,r.act)};}
function feedback(c,d){const g=d.g,r=c.ref;const pts=[g.v,g.s.ok,g.a.ok].filter(Boolean).length;
  const chip=(ok,t,wr)=>h('span',{class:'chip '+(wr?'wr':ok?'ok':'no')},(ok?'✔ ':wr?'~ ':'✘ ')+t);
  return h('div',{class:'fb'},h('b',null,`Análise de referência (${pts}/3)`),
    h('div',{style:'margin:6px 0'},chip(g.v,g.exact?'Veredito':g.alt?'Veredito aceitável':'Veredito',g.alt),chip(g.s.ok,'Sinais'),chip(g.a.ok,'Ações')),
    h('p',null,h('b',null,'Esperado: '),VERD[r.v]+(r.ok.length?` (também aceitável: ${r.ok.map(x=>VERD[x]).join(' / ')})`:'')),
    g.s.miss.length?h('p',{class:'badc'},'Sinais que faltaram: '+g.s.miss.map(x=>SIGS[x][0]).join('; ')):null,g.s.extra.length?h('p',{class:'badc'},'Sinais que não se aplicam: '+g.s.extra.map(x=>SIGS[x][0]).join('; ')):null,
    g.a.miss.length?h('p',{class:'badc'},'Ações que faltaram: '+g.a.miss.map(x=>ACTS[x]).join('; ')):null,g.a.extra.length?h('p',{class:'badc'},'Ações desnecessárias ou arriscadas aqui: '+g.a.extra.map(x=>ACTS[x]).join('; ')):null,
    h('p',null,r.why));}

/* ===== Debrief e relatório ===== */
function debrief(){const d=$('#dlg');const dn=Object.values(S.done);
  d.replaceChildren(h('h2',null,'Debrief'),h('p',null,`PRs revisados: ${dn.length}/${CASES.length} | Vereditos certos: ${dn.filter(x=>x.g.v).length} | Verificações executadas: ${Object.values(S.run).reduce((s,x)=>s+x.size,0)}`),
   h('p',null,h('b',null,'Calibração: '),calibTxt(dn.map(x=>({ok:x.g.v,conf:+x.a.conf}))),'. Errar com confiança alta é o ponto cego mais perigoso: reveja esses casos primeiro.'),
   h('h3',null,'Checklist de revisão de dependência'),h('ol',null,
    h('li',null,'Quem publicou? Mudou o mantenedor recentemente?'),h('li',null,'Tem provenance/assinatura? As versões anteriores tinham?'),h('li',null,'O diff e o changelog contam a mesma história?'),
    h('li',null,'Há script de instalação/build novo, binário opaco ou rede no instalador?'),h('li',null,'O diff do lockfile mudou algo além do pacote do PR? Algum hash mudou sem mudança de versão?'),
    h('li',null,'O nome é o do pacote que eu quero? Há versão de pacote interno no registry público?'),h('li',null,'O SBOM mudou? Há CVE conhecida (e o que acontece se eu NÃO atualizar)?')),
   h('h3',null,'Discussão'),h('ol',null,
    h('li',null,'Qual PR parecia o mais perigoso e era o mais seguro (PR-104)? O que o custo de rejeitar tudo por precaução causa ao time?'),
    h('li',null,'Qual ataque nenhum scanner de CVE pegaria? Por quê? (CVE só lista falhas conhecidas, não backdoors novos.)'),
    h('li',null,'Hash "OK" prova que o pacote é seguro? Em que caso o hash estava OK e mesmo assim havia risco?'),
    h('li',null,'Como reduzir a janela entre publicação e adoção (cooldown) sem atrasar correções de vulnerabilidade?'),
    h('li',null,'Em que ponto do pipeline vocês colocariam cada controle: PR, CI, registry interno, produção? (SBOM, provenance, lockfile, escopo, sandbox no CI.)')),
   h('h3',null,'Casos reais para estudar (pesquise depois)'),h('ul',null,
    h('li',null,'event-stream (2018): transferência de mantenedoria e dependência maliciosa.'),h('li',null,'ua-parser-js (2021): conta do mantenedor sequestrada.'),h('li',null,'Dependency confusion (2021): pacotes internos substituídos por versões públicas.'),
    h('li',null,'colors/faker (2022): sabotagem pelo próprio mantenedor.'),h('li',null,'xz-utils (2024): co-mantenedor construído ao longo de meses, backdoor no tarball de release.'),h('li',null,'SolarWinds (2020): comprometimento do processo de build.')),
   h('div',{style:'margin-top:12px'},h('button',{class:'sec',onclick:()=>d.close()},'Fechar')));d.showModal();}
function report(){const who=$('#analyst').value.trim()||'(não informado)';let m=`# Revisão de dependências - Supply Chain Lab\n\nAnalista: ${who}\n\n`;
  CASES.forEach(c=>{const d=S.done[c.id];m+=`## ${c.id} - ${c.pkg} ${c.from} -> ${c.to}\n`;if(!d){m+='- Não revisado\n\n';return;}
    m+=`- Veredito: ${VERD[d.a.v]}\n- Sinais: ${d.a.s.map(x=>SIGS[x][0]).join('; ')||'-'}\n- Ações: ${d.a.a.map(x=>ACTS[x]).join('; ')}\n- Justificativa: ${d.a.note||'-'}\n\n`;});
  const b=new Blob([m],{type:'text/markdown'});const u=URL.createObjectURL(b);const l=h('a',{href:u,download:'revisao-dependencias.md'});document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
const T0=Date.now();
function exportJson(lab,items,extra){const o={schema:1,lab,ts:new Date().toISOString(),mins:Math.round((Date.now()-T0)/60000),who:($('#analyst').value.trim()||null),items,extra:extra||{}};
  const b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const l=h('a',{href:u,download:`resultado-${lab}.json`});document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function calibTxt(list){const hi=list.filter(x=>x.conf>=4),lo=list.filter(x=>x.conf&&x.conf<=2);
  return `confiança alta (4-5): ${hi.filter(x=>x.ok).length} acertos e ${hi.filter(x=>!x.ok).length} erros | confiança baixa (1-2): ${lo.filter(x=>x.ok).length} acertos e ${lo.filter(x=>!x.ok).length} erros`;}
$('#bJson').addEventListener('click',()=>exportJson('supply-chain',Object.entries(S.done).map(([id,x])=>({id,conf:+x.a.conf,m:{veredito:x.g.v,sinais:x.g.s.ok,acoes:x.g.a.ok}})),{verificacoes:Object.values(S.run).reduce((s,x)=>s+x.size,0)}));
$('#bDeb').addEventListener('click',debrief);$('#bRep').addEventListener('click',report);
$('#bRst').addEventListener('click',()=>{if(confirm('Reiniciar? Todo o progresso será apagado.')){fresh();list();detail();}});
list();detail();
